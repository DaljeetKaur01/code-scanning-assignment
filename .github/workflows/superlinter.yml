name: Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  super-linter:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      statuses: write # Required for status reporting
      checks: write # Required for checks API
      pull-requests: write # For PR comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper analysis

      - name: Check if SARIF file exists
  id: check_sarif
  run: |
    if [ -f super-linter-results/super-linter.sarif ]; then
      echo "exists=true" >> $GITHUB_OUTPUT
    else
      echo "exists=false" >> $GITHUB_OUTPUT
    fi

- name: Upload SARIF Results
  if: steps.check_sarif.outputs.exists == 'true'
  uses: github/codeql-action/upload-sarif@v3
  with:
    sarif_file: super-linter-results/super-linter.sarif

      
